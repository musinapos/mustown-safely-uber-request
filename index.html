<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mustown - Safety Uber Request</title>
<style>
body{margin:0;font-family:Arial;background:#F8F8F8;color:#111}
.header{padding:28px 20px 12px;background:#fff}
.header h1{margin:0;font-size:30px}
.header p{color:#666;font-size:14px;margin:6px 0 0}
.tabs{display:flex;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid #eee}
.tabs button{flex:1;padding:10px;border-radius:20px;border:0;background:#F1F1F1;font-weight:600}
.tabs button.active{background:#111;color:#fff}
.card{background:#fff;margin:14px;padding:18px;border-radius:18px;box-shadow:0 1px 8px rgba(0,0,0,.05)}
label{font-size:11px;font-weight:700;color:#777}
input,select{width:100%;padding:14px;margin:8px 0 14px;border:1px solid #E6E6E6;border-radius:12px;background:#F9F9F9;font-size:15px;box-sizing:border-box}
button.main{width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:700}
button.small{padding:10px;border-radius:10px;background:#111;color:#fff;border:0;margin-top:6px;width:100%}
.status{background:#F1F8E9;padding:12px;border-radius:10px;margin-top:12px;font-size:14px;border-left:4px solid #111}
.job{background:#F9F9F9;padding:12px;border-radius:12px;margin-top:10px}
.benefit{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #eee;font-size:14px}
</style>
</head>
<body>
<div class="header">
<h1>Mustown</h1>
<p>Safety Uber Request — Safe. Simple. Reliable.</p>
</div>
<div class="tabs">
<button id="b1" class="active" onclick="show('cust')">Customer</button>
<button id="b2" onclick="show('driver')">Driver</button>
<button id="b3" onclick="show('admin')">Boss</button>
</div>
<div id="cust">
<div class="card">
<h2 style="margin:0">Book a Safe Ride</h2>
<p style="color:#666;font-size:13px">Your driver is verified and monitored by Mustown Boss.</p>
<label>YOUR NAME</label><input id="custName" placeholder="Full name">
<label>PHONE</label><input id="custPhone" placeholder="07...">
<label>PICKUP</label><input id="pickup" placeholder="Where to pick you?">
<label>DROP-OFF</label><input id="dropoff" placeholder="Where to?">
<label>PRICE</label><input id="priceOffer" placeholder="e.g. 350">
<button class="main" onclick="requestRide()">Request Safe Ride</button>
<div id="custStatus" class="status" style="display:none"></div>
<div id="custMyRide"></div>
</div>
<div class="card">
<div class="benefit"><span>Verified drivers</span><span>✓</span></div>
<div class="benefit"><span>Safe and clean cars</span><span>✓</span></div>
<div class="benefit"><span>Boss monitors every trip</span><span>✓</span></div>
<div class="benefit"><span>Pay after trip</span><span>✓</span></div>
</div>
</div>
<div id="driver" class="card" style="display:none">
<h3>Driver</h3>
<select id="driverName"><option value="Davis">Davis</option><option value="Dennis">Dennis</option></select>
<button class="main" onclick="loginDriver()">Go Online</button>
<div id="driverJobs" style="display:none"><p id="driverOnline"></p><div id="driverRequests">No jobs yet</div></div>
</div>
<div id="admin" class="card" style="display:none">
<h3>Drivers</h3><div id="adminDrivers">Loading...</div>
<h3 style="margin-top:18px">Requests</h3><div id="adminRequests">Loading...</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAxr3YY5JBhy_IZ-E6Q9wagGxPSSb1POAg",authDomain:"mtown-07790.firebaseapp.com",projectId:"mtown-07790",storageBucket:"mtown-07790.firebasestorage.app",messagingSenderId:"421618677628",appId:"1:421618677628:web:ce910417eb09410dcbd6f9",measurementId:"G-9KTX5J8G65"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
let currentDriver="Davis"; let myLastReqId=null;
window.show=function(v){ document.getElementById('cust').style.display=v=='cust'?'block':'none'; document.getElementById('driver').style.display=v=='driver'?'block':'none'; document.getElementById('admin').style.display=v=='admin'?'block':'none'; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); if(v=='cust') document.getElementById('b1').classList.add('active'); if(v=='driver') document.getElementById('b2').classList.add('active'); if(v=='admin') document.getElementById('b3').classList.add('active'); }
window.requestRide=async function(){ const name=document.getElementById('custName').value, phone=document.getElementById('custPhone').value, pickup=document.getElementById('pickup').value, dropoff=document.getElementById('dropoff').value, price=document.getElementById('priceOffer').value; if(!pickup||!dropoff){alert("Fill pickup and dropoff");return;} const d=await addDoc(collection(db,"requests"),{customer:name,phone:phone,pickup:pickup,dropoff:dropoff,price:price,status:"pending",assignedDriver:"",time:new Date().toISOString()}); myLastReqId=d.id; const s=document.getElementById('custStatus'); s.style.display='block'; s.innerHTML="<b>Request sent to Mustown Boss.</b> Your safe driver will be assigned shortly."; }
window.loginDriver=function(){ currentDriver=document.getElementById('driverName').value; document.getElementById('driverJobs').style.display='block'; document.getElementById('driverOnline').innerText=currentDriver+" is ONLINE"; loadDriverJobs(); }
window.acceptJob=async function(id){ await updateDoc(doc(db,"requests",id),{status:"accepted"}); }
window.arrivedJob=async function(id){ await updateDoc(doc(db,"requests",id),{status:"arrived"}); }
window.startTrip=async function(id){ await updateDoc(doc(db,"requests",id),{status:"on-trip"}); }
window.finishTrip=async function(id){ await updateDoc(doc(db,"requests",id),{status:"completed"}); }
window.assignDriver=async function(id){ const driver=document.getElementById('assign-'+id).value; await updateDoc(doc(db,"requests",id),{status:"assigned",assignedDriver:driver}); }
function loadDriverJobs(){ onSnapshot(collection(db,"requests"),snap=>{ let h=""; snap.forEach(d=>{const r=d.data(); if(r.assignedDriver==currentDriver && r.status!="completed" && r.status!="pending"){ h+=`<div class="job"><b>${r.pickup} → ${r.dropoff}</b><br>${r.customer} ${r.phone} - R${r.price} | ${r.status}<br><button class="small" onclick="acceptJob('${d.id}')">Accept</button><button class="small" onclick="arrivedJob('${d.id}')">Arrived</button><button class="small" onclick="startTrip('${d.id}')">Start Trip</button><button class="small" onclick="finishTrip('${d.id}')">Finish</button></div>`;}}); document.getElementById('driverRequests').innerHTML=h||"No jobs yet"; }); }
onSnapshot(collection(db,"requests"),snap=>{ let adminHtml=""; let custHtml=""; snap.forEach(d=>{const r=d.data(); if(d.id==myLastReqId) custHtml=`<div class="status"><b>${r.pickup} → ${r.dropoff}</b><br>Status: ${r.status}<br>Driver: ${r.assignedDriver||"Waiting for boss..."}</div>`; adminHtml+=`<div class="job"><b>${r.pickup} → ${r.dropoff}</b><br>${r.customer} (${r.phone}) - R${r.price} - ${r.status} | Driver: ${r.assignedDriver||"NONE"}<br><select id="assign-${d.id}"><option value="Davis">Davis</option><option value="Dennis">Dennis</option></select><button class="small" onclick="assignDriver('${d.id}')">Assign Driver</button></div>`; }); document.getElementById('adminRequests').innerHTML=adminHtml||"No requests"; if(myLastReqId) document.getElementById('custMyRide').innerHTML=custHtml; });
onSnapshot(collection(db,"drivers"),snap=>{ let h=""; snap.forEach(d=>{const r=d.data(); h+=`<div><b>${r.name||d.id}</b> - ● ONLINE - ${r.phone||""}</div>`;}); document.getElementById('adminDrivers').innerHTML=h||"No drivers"; });
</script>
</body>
</html>
