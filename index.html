<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mustown Uber Request</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#f1f5f9; text-align:center; }
  .top { background:#0f172a; padding:30px 20px 25px; color:white; border-bottom-left-radius:25px; border-bottom-right-radius:25px; }
  .top img { width:120px; height:120px; border-radius:26px; box-shadow:0 10px 25px rgba(0,0,0,0.4); background:white; }
  .top h1 { margin:15px 0 0; font-size:32px; }
  .top p { letter-spacing:5px; font-size:13px; opacity:0.8; margin-top:5px; }
  .box { background:white; margin:20px; padding:20px; border-radius:18px; box-shadow:0 5px 15px rgba(0,0,0,0.1); text-align:left; }
  label { font-weight:bold; font-size:14px; }
  input, select, textarea { width:100%; padding:12px; margin:8px 0 15px; border:1px solid #cbd5e1; border-radius:10px; font-size:15px; box-sizing:border-box; }
  button { width:100%; padding:15px; background:#0f172a; color:white; border:none; border-radius:12px; font-size:18px; font-weight:bold; cursor:pointer; }
  button:hover { background:#1e293b; }
  .install { margin:20px; }
  .install button { background:#2563eb; }
  .driver-card { display:flex; align-items:center; gap:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-top:12px; }
  .driver-card img { width:60px; height:60px; border-radius:50%; object-fit:cover; background:#cbd5e1; }
  .driver-card h3 { margin:0; font-size:16px; }
  .driver-card p { margin:2px 0; font-size:13px; color:#475569; }
  .live-dot { color:#16a34a; font-weight:bold; }
</style>
</head>
<body>

<!-- TOP LOGO -->
<div class="top">
  <img src="logo.png" alt="Mustown Uber Request">
  <h1>Mustown</h1>
  <p>UBER REQUEST</p>
</div>

<!-- DRIVERS LIVE FROM FIREBASE - AUTOMATIC UPDATES -->
<div class="box">
  <h2 style="text-align:center; margin:0;">Our Drivers <span class="live-dot">● LIVE</span></h2>
  <p style="text-align:center; font-size:13px; color:#64748b;">Updated automatically from Firebase</p>
  <div id="driversList">
    <p style="text-align:center;">Loading drivers...</p>
  </div>
</div>

<!-- REQUEST FORM -->
<div class="box">
  <h2 style="text-align:center; margin-top:0;">Request a Ride</h2>
  <label>Your Name</label>
  <input type="text" id="name" placeholder="e.g. Musina">

  <label>Phone Number</label>
  <input type="tel" id="phone" placeholder="e.g. 078 123 4567">

  <label>Pickup Location</label>
  <input type="text" id="pickup" placeholder="e.g. Mustown, Pretoria">

  <label>Destination</label>
  <input type="text" id="destination" placeholder="e.g. Pretoria CBD">

  <label>Number of Passengers</label>
  <select id="passengers">
    <option>1 Passenger</option>
    <option>2 Passengers</option>
    <option>3 Passengers</option>
    <option>4 Passengers</option>
    <option>5 Passengers</option>
    <option>6 Passengers</option>
    <option>7 Passengers</option>
  </select>

  <label>Notes</label>
  <textarea id="notes" rows="2" placeholder="Any extra info..."></textarea>

  <button onclick="sendRequest()">Request Uber Now</button>
</div>

<div class="install">
  <button onclick="installApp()">⬇ Download App</button>
</div>

<!-- NORMAL SCRIPT -->
<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
  } else {
    alert("To install: Tap Share > Add to Home Screen");
  }
}
function sendRequest(){
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const pickup = document.getElementById('pickup').value;
  const destination = document.getElementById('destination').value;
  const passengers = document.getElementById('passengers').value;
  const notes = document.getElementById('notes').value;
  if(!name || !pickup || !destination){
    alert("Please fill name, pickup and destination");
    return;
  }
  const msg = `Hello Mustown Uber%0A%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*From:* ${pickup}%0A*To:* ${destination}%0A*Passengers:* ${passengers}%0A*Notes:* ${notes}`;
  window.open(`https://wa.me/27600000000?text=${msg}`, '_blank');
}
</script>

<!-- FIREBASE CODE - LIVE UPDATES - ALREADY INSIDE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// THIS LISTENS AUTOMATICALLY - WHEN YOU CHANGE FIREBASE, APP CHANGES
onSnapshot(collection(db, "drivers"), (snapshot) => {
  let html = "";
  if(snapshot.empty){
    html = "<p style='text-align:center;'>No drivers online yet.</p>";
  }
  snapshot.forEach((doc) => {
    const d = doc.data();
    html += `
      <div class="driver-card">
        <img src="${d.photo || 'logo.png'}" alt="Driver">
        <div>
          <h3>🚗 ${d.name || 'Driver'}</h3>
          <p>📞 ${d.phone || ''}</p>
          <p>Car: ${d.car || 'Toyota Rumion'} | Plate: ${d.plate || ''}</p>
          <p>Status: ${d.status || 'Available'}</p>
        </div>
      </div>`;
  });
  document.getElementById("driversList").innerHTML = html;
});
</script>

</body>
</html>
