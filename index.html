<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUSTOWN UBER REQUEST - Musina</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff}
header{background:#0f172a;color:#fff;padding:16px;text-align:center;border-bottom:2px solid #16a34a}
header h1{font-size:26px;letter-spacing:2px}
header h1 span{color:#16a34a}
header p{font-size:12px;opacity:.8}
.wrap{max-width:520px;margin:auto;padding:14px}
.topCard{text-align:center;background:#fff;color:#000;border-radius:18px;padding:16px}
.topCard .emoji{font-size:54px}
.form{background:#fff;color:#000;border-radius:18px;padding:16px;margin-top:12px}
.form h3{text-align:center;margin-bottom:10px}
.form label{font-size:12px;font-weight:700;color:#333}
.form input,.form select,.form textarea{width:100%;padding:12px;margin:6px 0 10px;border:1.5px solid #ddd;border-radius:10px;font-size:14px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:6px}
.btn-green{background:#16a34a;color:#fff}
.btn-dark{background:#0f172a;color:#fff}
.quote{display:none;margin-top:12px;background:#f1f5f9;padding:14px;border-radius:12px;text-align:center}
.quote b{font-size:14px}
.quote span{font-size:22px;font-weight:900;color:#16a34a}
.drivers{background:#fff;color:#000;border-radius:18px;padding:16px;margin-top:12px}
.drivers h3{text-align:center}
.driver{display:flex;gap:10px;align-items:center;background:#f8fafc;padding:10px;border-radius:10px;margin-top:8px}
.driver img{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#cbd5e1}
.login{background:#fff;color:#000;border-radius:18px;padding:16px;margin-top:12px;text-align:center}
.login p{font-size:13px;color:#64748b}
footer{text-align:center;padding:16px;font-size:12px;opacity:.6}
</style>
</head>
<body>
<header>
<h1>MUSTOWN <span>UBER</span></h1>
<p>Mustown • Musina • DAVIS 0763584601</p>
</header>

<div class="wrap">
  <div class="topCard"><div class="emoji">🚕</div><h2>MUSTOWN UBER</h2><p style="font-size:13px;color:#64748b">Musina Only • Request a Ride</p></div>

  <div class="form">
    <h3>🚕 Request a Ride - Musina</h3>
    <label>Your Name</label><input id="mu-name" placeholder="e.g. Thabo">
    <label>Phone</label><input id="mu-phone" placeholder="e.g. 078 123 4567">
    <label>Pickup Location</label><input id="mu-pickup" value="Mustown, Musina">
    <label>Destination</label><input id="mu-dest" placeholder="e.g. Musina CBD, Nancefield, Ext 14">
    <label>Passengers</label>
    <select id="mu-pass"><option value="1">1 Passenger</option><option value="2">2 Passengers</option><option value="3">3 Passengers</option><option value="4">4 Passengers</option><option value="5">5 Passengers</option><option value="6">6 Passengers</option><option value="7">7 Passengers</option></select>
    <label>Notes</label><textarea id="mu-notes" rows="2" placeholder="Any extra info..."></textarea>
    <button class="btn btn-green" onclick="muQuote()">🚕 Request Uber Now</button>
    <div id="mu-quote" class="quote"><b id="mu-quoteText"></b><br><span id="mu-total"></span><br><button class="btn btn-green" onclick="muConfirm()">✅ Confirm & Send WhatsApp</button></div>
  </div>

  <div class="drivers">
    <h3>Our Drivers <span style="color:#16a34a">● LIVE</span> - Musina</h3>
    <p style="text-align:center;font-size:12px;color:#64748b" id="mu-debug">Loading from Firebase...</p>
    <div id="mu-drivers"></div>
  </div>

  <div class="login">
    <h3>🚗 Driver Login</h3><p>DAVIS 0763584601 • John 0725660255</p>
    <input id="mu-driverName" placeholder="Driver Name e.g. DAVIS" style="width:100%;padding:12px;margin:8px 0;border:1.5px solid #ddd;border-radius:10px">
    <button class="btn btn-dark" onclick="alert('Driver logged in: '+document.getElementById('mu-driverName').value)">Login as Driver</button>
  </div>

  <footer>MUSTOWN UBER • MUSINA • Powered by TAHOR / Musina POS Systems</footer>
</div>

<script>
let muTotal=0;
function muDistance(dest){let d=dest.toLowerCase();if(d.includes("cbd")||d.includes("musina town"))return 6;if(d.includes("nancefield"))return 5;if(d.includes("ext 14"))return 4;if(d.includes("mustown"))return 3;if(d.includes("hospital"))return 7;if(d.includes("border")||d.includes("beitbridge"))return 10;if(d.includes("mall")||d.includes("savoy")||d.includes("shoprite"))return 6;return 8;}
function muQuote(){
  let n=document.getElementById('mu-name').value.trim(), ph=document.getElementById('mu-phone').value.trim(), pk=document.getElementById('mu-pickup').value.trim(), ds=document.getElementById('mu-dest').value.trim(), ps=parseInt(document.getElementById('mu-pass').value);
  if(!n||!ph||!pk||!ds){alert('Fill name, phone, pickup and destination - Musina');return}
  let dist=muDistance(ds); let total=30 + (dist*8) + Math.max(0,ps-1)*10; muTotal=total;
  document.getElementById('mu-quote').style.display='block';
  document.getElementById('mu-quoteText').innerText=`From ${pk} to ${ds} • ${dist}km • ${ps} Passengers`;
  document.getElementById('mu-total').innerText='TOTAL: R'+total;
}
function muConfirm(){
  let n=document.getElementById('mu-name').value, ph=document.getElementById('mu-phone').value, pk=document.getElementById('mu-pickup').value, ds=document.getElementById('mu-dest').value, ps=document.getElementById('mu-pass').value, nt=document.getElementById('mu-notes').value;
  let msg=`Hello Mustown Uber Musina%0A%0A*Name:* ${n}%0A*Phone:* ${ph}%0A*From:* ${pk}%0A*To:* ${ds}%0A*Passengers:* ${ps}%0A*Notes:* ${nt}%0A%0A*QUOTED PRICE: R${muTotal}*`;
  window.open(`https://wa.me/27763584601?text=${msg}`,'_blank');
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAxr3YY5JBhy_IZ-E6Q9wagGxPSSb1POAg", authDomain: "mtown-07790.firebaseapp.com", projectId: "mtown-07790", storageBucket: "mtown-07790.firebasestorage.app", messagingSenderId: "421618677628", appId: "1:421618677628:web:ce910417eb09410dcbd6f9", measurementId: "G-9KTX5J8G65" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
onSnapshot(collection(db, "drivers"), (snap) => {
  document.getElementById("mu-debug").innerText = "Found in Firebase: " + snap.size + " drivers - Musina";
  let html="";
  if(snap.empty){
    html=`<div class="driver"><img src="logo.png" onerror="this.src='https://via.placeholder.com/60'"><div><b>🚗 DAVIS</b><br>📞 0763584601<br>Car: Rumion | Plate: 2264 L | Available</div></div><div class="driver"><img src="logo.png" onerror="this.src='https://via.placeholder.com/60'"><div><b>🚗 John</b><br>📞 0725660255<br>Driver | Available</div></div>`;
  } else {
    snap.forEach(doc=>{let d=doc.data(); html+=`<div class="driver"><img src="${d.photo||'logo.png'}" onerror="this.src='https://via.placeholder.com/60'"><div><b>🚗 ${d.name}</b><br>📞 ${d.phone}<br>Car: ${d.car||''} | Plate: ${d.plate||''} | ${d.status||'Available'}</div></div>`;});
  }
  document.getElementById("mu-drivers").innerHTML=html;
}, (err)=>{
  document.getElementById("mu-debug").innerText="Firebase error - showing saved drivers";
  document.getElementById("mu-drivers").innerHTML=`<div class="driver"><img src="logo.png"><div><b>🚗 DAVIS</b><br>📞 0763584601<br>Car: Rumion | Plate: 2264 L</div></div><div class="driver"><img src="logo.png"><div><b>🚗 John</b><br>📞 0725660255<br>Driver</div></div>`;
});
</script>
</body>
</html>
